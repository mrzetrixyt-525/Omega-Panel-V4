{% extends 'base.html' %}{% block content %}
<div class="auth-wrap"><div class="auth-card"><span class="eyebrow">RGNODES™</span><h2>{{ _('login') if mode=='login' else _('register') }}</h2><form method="post"><input type="hidden" name="csrf" value="{{csrf}}"><label>Username<input name="username" minlength="3" maxlength="32" required autocomplete="username"></label><label>Password<input type="password" name="password" minlength="8" required autocomplete="{{ 'current-password' if mode=='login' else 'new-password' }}"></label><button class="btn primary full" type="submit">{{ _('login') if mode=='login' else _('register') }}</button></form><p class="muted">{% if mode=='login' %}<a href="{{url_for('register')}}">Create an account</a>{% else %}<a href="{{url_for('login')}}">Back to login</a>{% endif %}</p></div></div>
{% endblock %}
